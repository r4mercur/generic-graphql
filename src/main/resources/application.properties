spring.application.name=generic-graphql

# H2 in-memory, damit das Beispiel ohne Setup laeuft.
# Fuer Postgres genuegt der Austausch dieser vier Zeilen - die Engine selbst
# ist datenbankneutral (kein DISTINCT ON, keine Window-Functions).
spring.datasource.url=jdbc:h2:mem:genericgraphql;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Auf true setzen, um die gebatchten DataLoader-Queries im Log zu sehen.
spring.jpa.show-sql=false

# Guardrails: der Client bestimmt die Form der Query, das Backend die Obergrenze.
gql.max-depth=12
gql.max-complexity=2000
