plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bjarne'
version = '0.0.1-SNAPSHOT'
description = 'generic-graphql'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // graphql - bewusst graphql-java direkt statt Spring-GraphQL/DGS:
    // schema-first-Frameworks stehen der dynamischen Typgenerierung im Weg.
    implementation 'com.graphql-java:graphql-java:26.1'
    implementation 'com.graphql-java:graphql-java-extended-scalars:24.0'
    implementation 'com.graphql-java:java-dataloader:5.0.0'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
