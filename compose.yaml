services:
  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    container_name: genericgraphql-postgres
    environment:
      POSTGRES_DB: genericgraphql
      POSTGRES_USER: genericgraphql
      POSTGRES_PASSWORD: genericgraphql
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genericgraphql -d genericgraphql"]
      interval: 3s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    container_name: genericgraphql-mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: genericgraphql
      MYSQL_USER: genericgraphql
      MYSQL_PASSWORD: genericgraphql
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  mysql-data:
